apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-error-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-error-demo
  template:
    metadata:
      labels:
        app: config-error-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          env:
            - name: BROKEN_VAR
              valueFrom:
                configMapKeyRef:
                  name: nonexistent-config
                  key: missing-key

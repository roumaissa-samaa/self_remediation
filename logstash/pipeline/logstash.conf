input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Use the app's emission time as the event timestamp
  date {
    match        => ["ts", "ISO8601"]
    target       => "@timestamp"
    remove_field => ["ts"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}

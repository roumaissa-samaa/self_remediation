apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-llm-rules
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: agent-llm.rules
    interval: 30s
    rules:
    - alert: PodUnhealthy
      # État courant uniquement → l'alerte se résout dès que le pod est sain.
      # On a retiré deux clauses qui gardaient l'alerte allumée alors que le pod
      # était déjà réparé (queue de comète de ~10 min, reason=None dans les logs) :
      #   - last_terminated_reason : reste =1 toute la vie du pod après un crash
      #   - increase(restarts_total[10m]) : reste vrai 10 min après le dernier restart
      # waiting_reason couvre déjà CrashLoopBackOff / ImagePullBackOff / OOMKilled / Error,
      # qui sont les états de blocage réels à remédier.
      expr: |
        kube_pod_container_status_waiting_reason{namespace="default", reason!="ContainerCreating", reason!="PodInitializing"} == 1
      for: 0s
      labels:
        severity: critical
      annotations:
        alertname: '{{ if $labels.reason }}{{ $labels.reason }}{{ else }}PodRestarting{{ end }}'
        service: '{{ $labels.pod }}'
        namespace: '{{ $labels.namespace }}'
        message: 'Pod {{ $labels.pod }} unhealthy in namespace {{ $labels.namespace }}: {{ $labels.reason }}'

    - alert: PodNotReady
      expr: kube_pod_container_status_ready{namespace="default"} == 0
      for: 1m
      labels:
        severity: warning
      annotations:
        alertname: PodNotReady
        service: '{{ $labels.pod }}'
        namespace: '{{ $labels.namespace }}'
        message: 'Pod {{ $labels.pod }} readiness probe failing in namespace {{ $labels.namespace }}'
